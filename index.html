<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fff0f5 0%, #ffe4ec 35%, #fce4ec 70%, #f8bbd0 100%);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      color: #5d4e6d;
      position: relative;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      color: #ff8fab;
      opacity: 0.55;
      animation: floatUp 9s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0.7; }
      100% { transform: translateY(-15vh) rotate(360deg) scale(1.1); opacity: 0; }
    }

    /* Tiny sparkles */
    .sparkle {
      position: fixed;
      width: 6px;
      height: 6px;
      background: #ffd1dc;
      border-radius: 50%;
      animation: sparkle 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes sparkle {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 36px 22px 70px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 4.4rem;
      color: #e91e63;
      margin-bottom: 6px;
      text-shadow: 0 4px 18px rgba(233, 30, 99, 0.25);
      animation: softPulse 3.2s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .subtitle {
      font-size: 1.15rem;
      color: #c2185b;
      margin-bottom: 32px;
      letter-spacing: 1.5px;
      opacity: 0.9;
    }

    .card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 30px 24px;
      box-shadow: 0 18px 45px rgba(233, 30, 99, 0.13);
      border: 1px solid rgba(255, 182, 193, 0.5);
      margin-bottom: 26px;
    }

    .message {
      font-size: 1.02rem;
      line-height: 1.78;
      color: #6b4c6b;
      text-align: left;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.15em;
      background: #e91e63;
      margin-left: 2px;
      animation: blink 0.75s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .photo-area {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 26px 0 8px;
    }

    .photo-box {
      width: 155px;
      height: 195px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(233, 30, 99, 0.2);
      border: 4px solid white;
      background: #ffe0eb;
      transition: transform 0.3s ease;
    }

    .photo-box:hover {
      transform: scale(1.04);
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn {
      background: linear-gradient(135deg, #ff6b9d, #e91e63);
      color: white;
      border: none;
      padding: 17px 44px;
      font-size: 1.12rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      box-shadow: 0 10px 28px rgba(233, 30, 99, 0.4);
      transition: all 0.3s ease;
      margin-top: 18px;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 35px rgba(233, 30, 99, 0.5);
    }

    /* Surprise section */
    .surprise {
      display: none;
      margin-top: 36px;
      animation: fadeInUp 0.8s ease;
    }

    .surprise.show {
      display: block;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animated Rose */
    .rose-container {
      position: relative;
      width: 120px;
      height: 140px;
      margin: 0 auto 22px;
    }

    .rose {
      font-size: 78px;
      animation: roseBloom 2.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 15px rgba(233, 30, 99, 0.3));
    }

    @keyframes roseBloom {
      0% { transform: scale(0.92) rotate(-6deg); }
      100% { transform: scale(1.08) rotate(6deg); }
    }

    .special-message {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 26px 22px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #6b4c6b;
      box-shadow: 0 12px 30px rgba(233, 30, 99, 0.12);
      border: 1px solid rgba(255, 182, 193, 0.5);
      text-align: center;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.95rem;
      color: #c2185b;
      opacity: 0.8;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 100;
      animation: confettiFall 3.2s linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Happy Birthday</h1>
    <p class="subtitle">with all my love</p>

    <div class="card">
      <div class="message" id="message"></div>
    </div>

    <div class="photo-area">
      <div class="photo-box">
        <img src="image1.jpeg" alt="Photo 1">
      </div>
      <div class="photo-box">
        <img src="image0.jpeg" alt="Photo 2">
      </div>
    </div>

    <button class="btn" id="surpriseBtn" onclick="showSurprise()">Click for a little surprise</button>

    <!-- Surprise content (hidden at first) -->
    <div class="surprise" id="surprise">
      <div class="rose-container">
        <div class="rose">🌹</div>
      </div>
      <div class="special-message">
        Thank youu for EVERYTHING...<br><br>
        I’m so lucky to have you.<br>
        Happy Birthdayy 💕
      </div>
    </div>

    <p class="footer">Made with love just for you</p>
  </div>

  <script>
    // Floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '♥';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (7 + Math.random() * 5) + 's';
      heart.style.fontSize = (15 + Math.random() * 20) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9500);
    }
    setInterval(createHeart, 650);

    // Tiny sparkles
    function createSparkle() {
      const sparkle = document.createElement('div');
      sparkle.classList.add('sparkle');
      sparkle.style.left = Math.random() * 100 + 'vw';
      sparkle.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 5000);
    }
    setInterval(createSparkle, 400);

    // Main birthday message
    const messageText = `Happy birthdayyyy 🎂✨

happy birthdayyyy 🥹💓

to the one who makes my little world
feel a little more magical ✨

i hope this new chapter of your life
is filled with the kind of happiness
that stays long after the candles go out.

may your dreams find their way to you,
may your heart always feel at home,
and may life be gentle with you
in all the ways you deserve. 🤍

i honestly don’t know how to put
everything i feel into words,
but thank you for everything 🥹💓

thank you for being you,
for making me smile,
and for making my little world
a happier place to be.

and honestly, i have a little weakness
for the way you call me "Madam".
i don't think you realise how much
i love those little names coming from you.
they make even the simplest moments
feel a little more special. 🥹🤍

if i could wish for one thing today,
it would be to see you smile
a thousand more times
and to be there for every single one.

in every little universe,
in every lifetime,
i think i'd still find my way to you. 🌙

thank you for being my favorite person
and my most beautiful kind of magic.

happy birthdayyyy 💖
i hope this year loves you
as much as i do 🫶🏻

and never forget,
this madam loves you so much. 🥹💓;

    const messageEl = document.getElementById('message');
    let i = 0;

    function typeWriter() {
      if (i < messageText.length) {
        messageEl.innerHTML = messageText.substring(0, i + 1) + '<span class="cursor"></span>';
        i++;
        setTimeout(typeWriter, 30);
      } else {
        messageEl.innerHTML = messageText;
      }
    }
    setTimeout(typeWriter, 800);

    // Show surprise + confetti
    function showSurprise() {
      const surprise = document.getElementById('surprise');
      surprise.classList.add('show');

      // Hide the button after clicking
      document.getElementById('surpriseBtn').style.display = 'none';

      // Confetti
      for (let j = 0; j < 80; j++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.classList.add('confetti');
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.background = ['#ff6b9d', '#ff8fab', '#f48fb1', '#f8bbd0', '#e91e63', '#ffc0cb', '#ffd1dc'][Math.floor(Math.random() * 7)];
          confetti.style.width = (7 + Math.random() * 9) + 'px';
          confetti.style.height = confetti.style.width;
          confetti.style.borderRadius = Math.random() > 0.4 ? '50%' : '2px';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 3400);
        }, j * 25);
      }

      // Scroll to the surprise smoothly
      setTimeout(() => {
        surprise.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    }
  </script>
</body>
</html>
